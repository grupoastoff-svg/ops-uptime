name: OPS availability
on:
  schedule:
    - cron: '3-59/4 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: ops-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public health endpoint
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors https://ops-centeruk.up.railway.app/api/health
